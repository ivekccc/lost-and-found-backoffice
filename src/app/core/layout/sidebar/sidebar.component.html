<nav class="sidebar" aria-label="Main">
  <a class="sidebar__brand" routerLink="/" (click)="navigate.emit()">
    <span class="sidebar__mark" aria-hidden="true">L&amp;F</span>
    <span class="sidebar__name">Lost &amp; Found</span>
    <span class="sidebar__scope">Admin</span>
  </a>

  @for (group of groups; track $index) {
    <div class="sidebar__group">
      @if (group.label) {
        <p class="sidebar__group-label">{{ group.label }}</p>
      }
      <ul class="sidebar__list">
        @for (item of group.items; track item.path) {
          <li>
            <a
              class="sidebar__link"
              [routerLink]="item.path"
              routerLinkActive="sidebar__link--active"
              #active="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
              [attr.aria-current]="active.isActive ? 'page' : null"
              (click)="navigate.emit()"
            >
              <i class="fa-solid sidebar__icon" [class]="item.icon" aria-hidden="true"></i>
              <span class="sidebar__label">{{ item.label }}</span>
              @if (item.countKey && counts()[item.countKey]; as count) {
                <span class="sidebar__count tabular" [attr.aria-label]="count + ' waiting'">{{ count }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
