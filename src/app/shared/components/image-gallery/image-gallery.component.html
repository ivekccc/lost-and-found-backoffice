@if (activeImage(); as active) {
  <div class="gallery">
    <div class="main-image-wrapper">
      <button
        type="button"
        class="main-image-btn"
        (click)="openFullscreen()"
        [attr.aria-label]="'View image ' + (activeIndex() + 1) + ' of ' + images().length + ' in fullscreen'"
      >
        <img [src]="active.imageUrl" [alt]="active.alt || 'Image ' + (activeIndex() + 1)" />
      </button>

      @if (hasMultiple()) {
        <button
          type="button"
          class="nav-btn nav-btn-prev"
          aria-label="Previous image"
          (click)="previous()"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button
          type="button"
          class="nav-btn nav-btn-next"
          aria-label="Next image"
          (click)="next()"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      }
    </div>

    @if (hasMultiple()) {
      <div class="thumbnails">
        <button
          type="button"
          class="thumb-nav"
          aria-label="Previous image"
          (click)="previous()"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div #thumbStrip class="thumb-strip" role="tablist" aria-label="Image thumbnails">
          @for (image of images(); track image.id; let index = $index) {
            <button
              type="button"
              role="tab"
              class="thumb"
              [class.active]="index === activeIndex()"
              [attr.aria-selected]="index === activeIndex()"
              [attr.aria-label]="'Show image ' + (index + 1)"
              (click)="select(index)"
            >
              <img
                [src]="image.imageUrl"
                [alt]="image.alt || 'Thumbnail ' + (index + 1)"
                loading="lazy"
              />
            </button>
          }
        </div>

        <button
          type="button"
          class="thumb-nav"
          aria-label="Next image"
          (click)="next()"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    }
  </div>

  @if (isFullscreen()) {
    <div class="fullscreen" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button
        type="button"
        class="fullscreen-close"
        aria-label="Close viewer"
        (click)="closeFullscreen()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

      <img
        class="fullscreen-img"
        [src]="active.imageUrl"
        [alt]="active.alt || 'Image ' + (activeIndex() + 1)"
      />

      @if (hasMultiple()) {
        <button
          type="button"
          class="fullscreen-nav fullscreen-nav-prev"
          aria-label="Previous image"
          (click)="previous()"
        >
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button
          type="button"
          class="fullscreen-nav fullscreen-nav-next"
          aria-label="Next image"
          (click)="next()"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="fullscreen-counter">
          {{ activeIndex() + 1 }} / {{ images().length }}
        </div>
      }
    </div>
  }
}
