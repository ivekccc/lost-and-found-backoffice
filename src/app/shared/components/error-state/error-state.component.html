<div class="error-state" role="alert">
  <i class="fa-solid error-state__icon" [class]="icon" aria-hidden="true"></i>
  <p class="error-state__title">{{ title }}</p>
  <p class="error-state__message">{{ message }}</p>
  @if (showRetry) {
    <button type="button" class="btn btn-secondary btn-sm" (click)="onRetry()">
      <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
      {{ retryText }}
    </button>
  }
</div>
