<div class="bo-modal-header">
  <h4>Minimum Questions</h4>
  <button type="button" class="btn-close-modal" (click)="bsModalRef.hide()">
    <i class="fa-solid fa-close"></i>
  </button>
</div>

<form [formGroup]="minQuestionsForm" (ngSubmit)="submit()">
  <div class="bo-modal-body">
    <p class="text-muted mb-3">
      Minimum verification questions a finder must ask when composing a
      challenge for the <strong>{{ category.name }}</strong> category.
    </p>

    <div class="form-control-wrapper">
      <label for="minQuestions">Minimum questions</label>
      <input
        type="number"
        class="form-control"
        id="minQuestions"
        formControlName="minQuestions"
        min="1"
        max="10"
        [ngClass]="{ 'is-invalid': minQuestionsForm.controls.minQuestions.touched && minQuestionsForm.controls.minQuestions.invalid }"
      />
      @if (minQuestionsForm.controls.minQuestions.touched && minQuestionsForm.controls.minQuestions.invalid) {
        <span class="error-text">Enter a value between 1 and 10</span>
      }
    </div>
  </div>

  <app-confirm-buttons
    [saveButtonTypeSubmit]="true"
    [cancelButtonDisabled]="minQuestionsForm.disabled"
    [saveButtonDisabled]="!minQuestionsForm.valid"
    (editButtonsCancel)="bsModalRef.hide()">
  </app-confirm-buttons>
</form>
