@if (loading()) {
  <app-data-table-skeleton
    [showReload]="true"
    [showButton]="true"
    [columnCount]="6"
  />
} @else {
  <app-data-table
    [data]="reports()"
    [headingText]="'All Reports'"
    [buttonText]="'New Report'"
    [emptyMessage]="'No reports found'"
    [showReload]="true"
    (addNew)="addNewReport()"
    (reload)="reloadReports()"
  >
    <ng-template dataTableHeaderTemplate>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Category</th>
        <th>Status</th>
        <th>Location</th>
        <th>Created</th>
      </tr>
    </ng-template>
    <ng-template dataTableRowTemplate let-row="row">
      <tr [routerLink]="['/reports', row.id]">
        <td>{{ row.title }}</td>
        <td>
          <span class="badge" [class.bg-danger]="row.type === 'LOST'" [class.bg-success]="row.type === 'FOUND'">
            {{ row.type }}
          </span>
        </td>
        <td>{{ row.categoryName }}</td>
        <td>
          <span class="badge bg-secondary">{{ row.status }}</span>
        </td>
        <td>{{ row.location?.formattedAddress || '-' }}</td>
        <td>{{ row.createdAt | date: 'dd.MM.yyyy HH:mm' }}</td>
      </tr>
    </ng-template>
  </app-data-table>
}
